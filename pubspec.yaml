name: info_tel
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_localizations:
    sdk: flutter

  sqflite: ^2.0.0+4
  system_info2: ^4.0.0
  battery_plus: ^6.0.2
  open_file: ^3.3.2
  network_info_plus: ^6.0.0
  flutter_speedtest: ^0.2.0
  pdf: ^3.11.1
  flutter_media_info: ^0.0.3
  clipboard: ^0.1.3
  webview_flutter: ^4.8.0
  webview_flutter_android: ^3.16.6
  webview_flutter_wkwebview: ^3.14.0
  permission_handler: ^11.3.1
  fluttertoast: ^8.0.8
  sensors_plus: ^6.0.1
  path_provider: ^2.1.4
  device_info_plus: ^10.1.2
  vibration: ^1.7.4
  installed_apps: ^1.5.0
  path: ^1.8.0
  win32: ^5.5.4
  intl: ^0.19.0
  url_launcher: ^6.1.7
  mockito: ^5.0.16
  build_runner: ^2.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/lang/en.json
    - assets/lang/ru.json
    - assets/fonts/Roboto-Regular.ttf